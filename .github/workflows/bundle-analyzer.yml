name: Bundle Chunk Size Analyzer

on:
  pull_request:
    branches: [main]

jobs:
  analyze:
    name: Check Chunk Sizes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Build
        run: |
          npm ci
          npm run build

      - name: Run Bundle Audit
        run: node scripts/bundle-size-audit.cjs

